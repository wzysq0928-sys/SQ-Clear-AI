<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111318"><title>Clear AI</title>
<style>
:root{color-scheme:dark;--bg:#111318;--panel:#191c23;--panel2:#222630;--text:#f4f5f7;--muted:#9da4b2;--line:#303541;--accent:#dce6ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.app{max-width:850px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}header{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(17,19,24,.94);z-index:2}.brand{font-size:18px;font-weight:700}.brand span{color:#a9c2ff}.status{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:6px 9px;border-radius:999px}main{flex:1;display:flex;flex-direction:column;padding:26px 0 18px}.hero{margin:auto 0 24px;text-align:center;padding:26px 0 8px}.orb{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,#dce6ff,#8ea8ef);color:#151922;display:grid;place-items:center;font-size:25px;font-weight:800;margin:0 auto 18px}.hero h1{font-size:28px;margin:0 0 10px}.hero p{color:var(--muted);line-height:1.55;margin:0 auto;max-width:500px;font-size:14px}#messages{display:flex;flex-direction:column;gap:18px;margin-bottom:18px}.msg{white-space:pre-wrap;line-height:1.65;overflow-wrap:anywhere}.user{align-self:flex-end;background:var(--panel2);border:1px solid var(--line);padding:11px 14px;border-radius:18px 18px 5px 18px;max-width:88%}.assistant{align-self:stretch;padding:2px 3px;color:#e8eaf0}.label{font-size:11px;color:var(--muted);margin-bottom:5px}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}.suggestion{background:transparent;border:1px solid var(--line);border-radius:14px;padding:13px;text-align:left;color:var(--text);font-size:13px;line-height:1.45}.composer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 18%);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}.inputbox{display:flex;align-items:flex-end;gap:9px;background:var(--panel);border:1px solid #3b414e;border-radius:22px;padding:9px 10px 9px 15px}textarea{resize:none;flex:1;min-height:28px;max-height:140px;border:0;outline:0;background:transparent;color:var(--text);font:16px -apple-system,BlinkMacSystemFont,sans-serif;line-height:1.5;padding:4px 0}button{font:inherit;cursor:pointer}.send{width:38px;height:38px;border:0;border-radius:14px;background:var(--accent);color:#111827;font-size:18px;font-weight:700;flex-shrink:0}.send:disabled{opacity:.4}.foot{text-align:center;color:#777f8e;font-size:11px;line-height:1.5;margin-top:8px}.controls{display:flex;justify-content:space-between;gap:10px;margin:0 0 10px}.smallbtn{border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;padding:7px 10px;border-radius:9px}.notice{border:1px solid #554d35;background:#282519;color:#d7cda9;padding:12px;border-radius:12px;font-size:12px;line-height:1.55;margin-bottom:16px}.hidden{display:none!important}@media(min-width:650px){.app{padding-left:26px;padding-right:26px}.hero h1{font-size:34px}}
</style></head><body><div class="app"><header><div class="brand">Clear <span>AI</span></div><div class="status" id="status">本地模型 · 未加载</div></header><main><div class="hero" id="hero"><div class="orb">C</div><h1>有什么想法？</h1><p>尝试在浏览器本地运行 AI 的聊天网页。无需 API Key，不按 Token 计费。</p></div><div class="notice" id="notice">首次使用需要下载开源模型文件（可能数百 MB），请使用稳定 Wi‑Fi 并保持页面打开。iPhone 可能因内存或浏览器限制而无法运行。</div><div id="messages" aria-live="polite"></div><div class="suggestions" id="suggestions"><button class="suggestion" data-prompt="用简单的中文解释什么是人工智能。">解释一个复杂概念<br><span style="color:#9da4b2">用简单中文说明</span></button><button class="suggestion" data-prompt="帮我制定一个健康、现实的周末学习计划，注意安排足够睡眠。">制定一个计划<br><span style="color:#9da4b2">清晰、可执行</span></button><button class="suggestion" data-prompt="给我 5 个适合初学者的编程项目，并说明各自能学到什么。">探索新点子<br><span style="color:#9da4b2">从简单项目开始</span></button><button class="suggestion" data-prompt="请用一个生活中的例子解释批判性思维。">深入思考<br><span style="color:#9da4b2">分析与推理</span></button></div></main><div class="composer"><div class="controls"><button class="smallbtn" id="loadBtn">加载本地 AI 模型</button><button class="smallbtn" id="clearBtn">清空对话</button></div><div class="inputbox"><textarea id="prompt" rows="1" placeholder="给 Clear AI 发送消息…" enterkeyhint="send"></textarea><button class="send" id="send" aria-label="发送">↑</button></div><div class="foot">模型在浏览器内运行 · 需要兼容的浏览器和足够内存<br>回答可能不准确；首次加载时间较长</div></div></div>
<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2';
env.allowLocalModels=false;env.useBrowserCache=true;
let generator=null,busy=false;const $=id=>document.getElementById(id);const status=$('status'),send=$('send'),prompt=$('prompt');
function setStatus(s){status.textContent=s}
function addMsg(role,text){$('hero').classList.add('hidden');$('suggestions').classList.add('hidden');$('notice').classList.add('hidden');const d=document.createElement('div');d.className='msg '+role;if(role==='assistant'){const l=document.createElement('div');l.className='label';l.textContent='CLEAR AI';d.appendChild(l)}const t=document.createElement('div');t.textContent=text;d.appendChild(t);$('messages').appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'});return t}
async function loadModel(){if(generator||busy)return;busy=true;$('loadBtn').disabled=true;setStatus('正在加载模型…');try{generator=await pipeline('text-generation','onnx-community/Qwen2.5-0.5B-Instruct',{dtype:'q4',device:'webgpu',progress_callback:p=>{if(p.status==='progress'&&p.file)setStatus('下载模型文件…')}});setStatus('本地模型 · 已就绪');$('notice').classList.add('hidden');addMsg('assistant','模型已加载，可以开始聊天。')}catch(e){console.error(e);setStatus('模型加载失败');addMsg('assistant','模型没有成功启动。可能是浏览器不支持 WebGPU、内存不足或模型下载受限。请尝试更新 iOS、使用 Safari 和 Wi‑Fi 后重试。错误：'+(e?.message||String(e)))}finally{busy=false;$('loadBtn').disabled=false}}
async function ask(text){text=text.trim();if(!text||busy)return;addMsg('user',text);prompt.value='';prompt.style.height='auto';if(!generator){addMsg('assistant','请先点“加载本地 AI 模型”。首次下载可能需要较长时间。');return}busy=true;send.disabled=true;setStatus('正在思考…');const out=addMsg('assistant','正在生成回答…');try{const result=await generator([{role:'system',content:'你是一个有帮助、诚实的中文 AI 助手。优先用简体中文回答，表达清晰，不确定时说明不确定。'},{role:'user',content:text}],{max_new_tokens:256,temperature:0.7,do_sample:true});const g=result?.[0]?.generated_text;let answer='';if(Array.isArray(g))answer=g.filter(x=>x.role==='assistant').map(x=>x.content).join('\n');else answer=String(g||'').trim();out.textContent=answer||'模型没有返回可显示的内容，请重试。'}catch(e){out.textContent='生成失败：'+(e?.message||String(e))}finally{busy=false;send.disabled=false;setStatus('本地模型 · 已就绪')}}
$('loadBtn').addEventListener('click',loadModel);$('send').addEventListener('click',()=>ask(prompt.value));prompt.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(prompt.value)}});prompt.addEventListener('input',()=>{prompt.style.height='auto';prompt.style.height=Math.min(prompt.scrollHeight,140)+'px'});$('clearBtn').addEventListener('click',()=>{$('messages').innerHTML='';$('hero').classList.remove('hidden');$('suggestions').classList.remove('hidden');$('notice').classList.remove('hidden')});document.querySelectorAll('[data-prompt]').forEach(b=>b.addEventListener('click',()=>{prompt.value=b.dataset.prompt;ask(prompt.value)}));
</script></body></html>
